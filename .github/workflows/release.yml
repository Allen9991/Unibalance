name: Web release artifact

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Scan tracked files for secrets
        run: pnpm check:secrets
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test application
        run: pnpm test
      - name: Test engineering tooling
        run: pnpm test:tooling
      - name: Build web
        run: pnpm build
      - name: Package artifact with checksums
        run: pnpm release:artifact
      - name: Upload reviewable web artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unibalance-web-${{ github.sha }}
          path: |
            release/unibalance-web.tar.gz
            release/manifest.json
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
